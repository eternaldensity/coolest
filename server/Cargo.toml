[package]
name = "server"
version = "0.0.1"
edition = "2021"

[dependencies]
sim = { path = "../sim" }
serde_json = "1"

# Network runtime only: mio (via net) cannot target wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.2", features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
